# This file is used to run AI Workspace and `browserless` with Docker Compose.
#
# The two containers are linked together and AI Workspace is configured to use `browserless`
# as its Puppeteer endpoint (from the containers intranet, it is available browserless:3000).
#
# From your host, you can access AI Workspace on http://127.0.0.1:3000 and browserless on http://127.0.0.1:9222.
#
# To start the containers, run:
#   docker-compose -f docs/docker/docker-compose-browserless.yaml up

version: '3.9'

services:
  ai-workspace:
    image: ghcr.io/jrmatherly/ai-workspace:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PUPPETEER_WSS_ENDPOINT=ws://browserless:3000/chromium?token=change-me
    depends_on:
      - browserless

  browserless:
    # browserless v2 (browserless/chrome on Docker Hub is the abandoned v1); pin a release tag, :latest tracks main
    image: ghcr.io/browserless/chromium:v2.57.0
    ports:
      - "9222:3000"  # Map host's port 9222 to container's port 3000
    environment:
      - TOKEN=change-me
      - CONCURRENT=4
      - TIMEOUT=60000  # ms per session; a page load plus screenshot can take ~30 s, over the 30000 default