---
apiVersion: v1
kind: Namespace
metadata:
  name: ns-ai-workspace
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ai-workspace
  name: deployment-ai-workspace
  namespace: ns-ai-workspace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-workspace
  strategy: {}
  template:
    metadata:
      labels:
        app: ai-workspace
    spec:
      containers:
        - image: ghcr.io/jrmatherly/ai-workspace:latest
          name: ai-workspace
          ports:
            - containerPort: 3000
          args:
            - next
            - start
            - -p
            - "3000"
          envFrom:
            - secretRef:
                name: env
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: ai-workspace
  name: svc-ai-workspace
  namespace: ns-ai-workspace
spec:
  ports:
    - name: "http"
      port: 3000
      targetPort: 3000
  selector:
    app: ai-workspace
