name: 🧪 CI

# Type-check (app + tools/tests projects), lint, and test on every push and PR.
# Tests: network tests are key-gated and skip without keys, so `npm test` here
# runs only the offline, deterministic lane.

on:
  push:
    branches: [ main ]
    paths-ignore: &docs-only
      - '**.md'
      - 'docs/**'
      - 'kb/**'
      - '.claude/**'
      - '.upstream-review/**'
      - '.serena/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - 'LICENSE'
      - '.remember/**'
  pull_request:
    paths-ignore: *docs-only

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 🧪 Checks
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🟢 Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Type check (app, tools, tests)
        run: npm run tscheck

      # LLM defs map: enable to fail PRs on a stale committed map (kept off: quick GitHub-side edits
      # can't run the generator, and Vercel/Docker builds regenerate it anyway via prebuild)
      # - name: LLM defs map check
      #   run: node tools/develop/gen-llms-defs/generate-llms-defs.mjs --check

      - name: 🔍 Lint
        run: npm run lint

      - name: 🧪 Test
        run: npm test
