# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: 🐳 Docker images

on:
  push:
    branches:
      - main
    tags:
      - 'v20*'        # Release tags, CalVer (v2026.10.11)
    # GitHub does not evaluate path filters on tag pushes, so release tags always build
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'kb/**'
      - '.claude/**'
      - '.upstream-review/**'
      - '.serena/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - 'LICENSE'
      - '.remember/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded main build is safe to drop; a release tag build must finish
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Build job: runs on native runners for each platform (no QEMU emulation)
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    name: 🐳 Build ${{ matrix.platform }}
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: 🧰 Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 🛠️ Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=AI Workspace
            org.opencontainers.image.description=AI Workspace: self-hosted, local-first multi-model AI chat
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/jrmatherly/ai-workspace

      - name: 🐳 Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          build-args: |
            NEXT_PUBLIC_GA4_MEASUREMENT_ID=${{ secrets.GA4_MEASUREMENT_ID }}
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.POSTHOG_HOST }}
            NEXT_PUBLIC_SPOTLIGHT_FEED_URL=${{ vars.SPOTLIGHT_FEED_URL }}
            NEXT_PUBLIC_BUILD_HASH=${{ github.sha }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          provenance: false
          cache-from: type=gha,scope=${{ github.repository }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ github.repository }}-${{ matrix.platform }},mode=max

      - name: 📝 Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: 📤 Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge job: combines platform-specific images into a unified multi-arch manifest
  merge:
    name: 🧬 Merge manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    permissions:
      contents: read
      packages: write

    steps:
      - name: 🧰 Prepare
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: 📥 Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: 🛠️ Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Development: main branch
            type=raw,value=development,enable=${{ github.ref == 'refs/heads/main' }}

            # Latest: release tags (vYYYY.M.D)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

            # Stable: release tags (alias)
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

            # Version tags (v2026.10.11.1 and 2026.10.11.1). Not type=semver: a CalVer MICRO version has four parts, which semver drops silently
            type=ref,event=tag
            type=match,pattern=^v(.+)$,group=1

      - name: 🚀 Publish manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046 # word splitting is intended: one -t per tag, one arg per digest
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            --annotation='index:org.opencontainers.image.title=AI Workspace' \
            --annotation='index:org.opencontainers.image.description=AI Workspace: self-hosted, local-first multi-model AI chat' \
            --annotation='index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}' \
            --annotation='index:org.opencontainers.image.url=https://github.com/jrmatherly/ai-workspace' \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}@sha256:%s ' *)

      - name: 🔍 Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ steps.meta.outputs.version }}