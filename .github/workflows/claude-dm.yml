# Requires the CLAUDE_CODE_OAUTH_TOKEN repo secret.
# Inert until it is set: the action step fails without it.
name: 🤖 Claude Code DM

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-dm:
    name: 🤖 Claude DM
    # Only allow repository owner to trigger DMs with @claude (blocks other users and bots)
    if: |
      github.actor == 'jrmatherly' &&
      github.triggering_actor == 'jrmatherly' &&
      ((github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')))

    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Job-level so comments without @claude (skipped by `if`) never enter the queue. No cancel, so a
    # follow-up @claude never kills a run mid-commit. GitHub keeps one pending run per group: a third
    # @claude while one runs replaces the pending second one.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false

    permissions:
      contents: write  # Required for code creation and commits
      issues: write
      pull-requests: write
      actions: read # Required for Claude to read CI results on PRs
      id-token: write # required to use OIDC to authenticate to Claude Code API

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 1 -> 0: full history helps with git blame, etc.

      - name: 🤖 Claude response
        id: claude
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        env:
          CLAUDE_CODE_SUBAGENT_MODEL: claude-opus-5-5 # brains on Fable (--model below), delegated subagents on the latest Opus
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Security: Only users with write access can trigger (DMs allow code execution)
          # Note: contents:write permission enables code creation and commits

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/cli-reference for available options
          claude_args: |
            --model claude-fable-5-1
            --max-turns 300
            --allowedTools "Edit,Read,Grep,Glob,Write,WebFetch,WebSearch,Skill,Agent,LSP,Bash(cat:*),Bash(cp:*),Bash(find:*),Bash(git branch:*),Bash(grep:*),Bash(ls:*),Bash(mkdir:*),Bash(npm run:*),Bash(gh issue:*),Bash(gh search:*),Bash(gh label:*),Bash(gh pr:*)"
