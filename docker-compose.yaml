# Very simple docker-compose file to run the app on http://localhost:3000 (or http://127.0.0.1:3000).
#
# For more examples, such running AI Workspace alongside a web browsing service, see the `docs/docker` folder.

services:
  big-agi:
    image: ghcr.io/jrmatherly/ai-workspace:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
